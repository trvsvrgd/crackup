services:
  - type: web
    name: crackup-protocol-eclipse
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: crackup-agent-data
      mountPath: /var/data
      sizeGB: 1

